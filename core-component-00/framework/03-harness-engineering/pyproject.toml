[project]
name = "cc00-harness-engineering"
version = "0.1.0"
description = "CC-00 Layer 3 (Harness Engineering) — test environment for implementations/"
readme = "README.md"
requires-python = ">=3.10"

# implementations/ itself has no third-party dependencies (stdlib only). pytest and
# pytest-asyncio are needed to run testing/ (test_error_boundary.py and
# test_tool_registry.py use @pytest.mark.asyncio).
dependencies = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.uv]
package = false
