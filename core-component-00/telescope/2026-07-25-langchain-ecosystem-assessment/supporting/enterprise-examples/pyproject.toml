[project]
name = "cc00-enterprise-examples"
version = "0.1.0"
description = "Runnable enterprise-grade examples for the LangChain ecosystem, built on CC-00 patterns"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
